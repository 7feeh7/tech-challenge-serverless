sonar.organization=7feeh7
sonar.projectKey=7feeh7_tech-challenge-serverless
sonar.projectName=tech-challenge-serverless
sonar.projectVersion=1.0

# Fontes e testes
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Cobertura (lcov gerado pelo Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=tests/**/*.spec.ts

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
